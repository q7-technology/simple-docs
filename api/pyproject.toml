[project]
name = "simple-docs-api"
version = "0.1.0"
description = "Simple Docs API"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  # argon2id password hashes, as the design's data model says
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# httpx2: what newer Starlette test clients want, as in Simple LMS
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx2>=0.1", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
sdocs = "sdocs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = [
  "error",
  # third-party: Starlette's test client still uses an old anyio alias
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sdocs"]
# the api/alembic folder would otherwise make ruff count the alembic package as ours
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# a test reads best with its assertion on one line
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["sdocs"]
ignore_missing_imports = true
